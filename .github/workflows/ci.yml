name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Block card numbers in the repository (PCI guard)
        run: python tools/scan_repo_for_pans.py
      - name: Validate source specs
        run: |
          python -c "from cardpulse_frameworks.ingestion.spec import load_specs; print(len(load_specs('configs/sources')), 'source specs valid')"
          python -c "from cardpulse_frameworks.silver.spec import load_silver_specs; print(len(load_silver_specs('configs/silver')), 'silver specs valid')"
      - name: Unit and integration tests
        run: pytest
      - name: End-to-end smoke run (small portfolio, local profile)
        run: |
          cardpulse-synth --config synthetic-data/config/small.yaml --env local --clean
          cardpulse-ingest run --env local --all
          cardpulse-silver run --env local --fail-on-reject
          cardpulse-gold run --env local
          cardpulse-ingest report --env local
          cardpulse-silver report --env local
          cardpulse-gold report --env local
      - name: Gold rerun is a no-op (Silver unchanged, nothing restaged)
        run: |
          cardpulse-gold run --env local | tee gold-rerun.txt
          python tools/check_rerun_noop.py gold-rerun.txt
