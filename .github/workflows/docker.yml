name: docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nabatripathy/cardpulse

jobs:
  # One native build per architecture (GitHub's free Arm runners for public repositories),
  # each smoke-tested on its own CPU; on main, a multi-arch manifest joins them, so Intel and
  # Apple-chip machines pull the same tag and no --platform flag is needed.
  image:
    name: image ${{ matrix.arch }} (build, smoke test, push on main)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (linux/${{ matrix.arch }}, native)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: cardpulse:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test inside the image (small portfolio, local profile, through decisions)
        run: |
          docker run --rm cardpulse:ci sh -c "
            cardpulse-synth --config synthetic-data/config/small.yaml --env local --clean &&
            cardpulse-ingest run --env local --all &&
            cardpulse-silver run --env local --fail-on-reject &&
            cardpulse-gold run --env local &&
            cardpulse-decide run --env local &&
            cardpulse-decide report --env local"

      - name: Image size
        run: docker image ls cardpulse:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the ${{ matrix.arch }} image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="$IMAGE:${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker tag cardpulse:ci "$tag"
          docker push "$tag"

  publish:
    name: publish multi-arch image (main)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join amd64 and arm64 into one tag (commit and latest)
        run: |
          short="${GITHUB_SHA::12}"
          docker buildx imagetools create -t "$IMAGE:$short" -t "$IMAGE:latest" \
            "$IMAGE:$short-amd64" "$IMAGE:$short-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
          echo "Published $IMAGE:$short and $IMAGE:latest for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  docker-profile:
    name: docker-profile (S3 store, Iceberg REST, Marquez end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARDPULSE_PROFILE: small
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Pull service images
        run: |
          failed=0
          for img in $(docker compose config --images | grep -v cardpulse); do
            if docker pull --quiet "$img" >/dev/null 2>pull.err; then
              echo "pulled $img"
            else
              echo "::error title=image pull failed::$img: $(tr '\n' ' ' < pull.err | cut -c1-300)"
              failed=1
            fi
          done
          exit $failed

      - name: Build the runner image
        run: docker compose --profile run build cardpulse

      - name: Start SeaweedFS (S3), Iceberg REST catalog and Marquez
        run: docker compose up -d seaweedfs iceberg-rest marquez-db marquez marquez-web

      - name: Wait for the object store, catalog and Marquez
        run: python3 tools/wait_for.py --timeout 240 http://localhost:9333/cluster/status http://localhost:8181/v1/config http://localhost:5000/api/v1/namespaces

      - name: Run generate, Bronze, Silver, Gold, decisions and verification in the runner
        run: |
          set -o pipefail
          docker compose --profile run run --rm cardpulse 2>&1 | tee runner.log

      - name: Rerun is a no-op (idempotent against the docker services)
        run: |
          set -o pipefail
          docker compose --profile run run --rm cardpulse sh -c "
            cardpulse-ingest run --env docker --all &&
            cardpulse-silver run --env docker --fail-on-reject &&
            cardpulse-gold run --env docker" 2>&1 | tee rerun.txt
          python3 tools/check_rerun_noop.py rerun.txt

      - name: Lineage in Marquez
        run: |
          curl -fsS "http://localhost:5000/api/v1/namespaces/cardpulse-docker/jobs?limit=100" \
            | python3 -c "import json,sys; jobs=json.load(sys.stdin)['jobs']; print(len(jobs), 'jobs:', ', '.join(sorted(j['name'] for j in jobs)))"

      - name: Service logs
        if: failure()
        run: |
          docker compose ps -a
          for f in runner.log rerun.txt; do
            [ -f "$f" ] || continue
            msg=$(grep -v '^{' "$f" | tail -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=output: $f::$msg"
          done
          for svc in seaweedfs iceberg-rest marquez-db marquez; do
            docker compose --profile run logs --no-color --tail 25 "$svc" > "svc.log" 2>&1 || true
            msg=$(tail -c 2500 svc.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=logs: $svc::$msg"
          done

      - name: Stop
        if: always()
        run: docker compose --profile run down -v
