version: 2

models:
  - name: dim_customer
    description: Customer dimension, SCD Type 2 (one row per customer version)
    columns:
      - name: customer_sk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: segment_cd
        data_tests:
          - accepted_values:
              arguments: {values: [MASS, AFFLUENT, PREMIER, STUDENT]}
              config: {severity: warn}
    data_tests:
      - expression_is_true:
          arguments: {expression: "valid_from < valid_to"}

  - name: dim_account
    description: Card account dimension, SCD Type 2 (one row per account version)
    columns:
      - name: account_sk
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [not_null]
      - name: primary_customer_id
        data_tests: [not_null]
      - name: status_cd
        data_tests:
          - accepted_values:
              arguments: {values: [OPEN, CLOSED, CHARGED_OFF, BLOCKED]}
    data_tests:
      - expression_is_true:
          arguments: {expression: "valid_from < valid_to"}
      - expression_is_true:
          arguments: {expression: "credit_limit > 0", where: "status_cd = 'OPEN'"}

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: calendar_date
        data_tests: [unique, not_null]

  - name: dim_merchant_category
    columns:
      - name: mcc
        data_tests: [unique, not_null]

  - name: dim_offer
    columns:
      - name: offer_sk
        data_tests: [unique, not_null]
      - name: compliance_approval_id
        data_tests: [not_null]

  - name: fct_transaction
    description: Posted transactions at transaction grain, keyed to dimension versions on the transaction date
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: account_sk
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_account'), field: account_sk}
      - name: customer_sk
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_sk}
      - name: txn_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: mcc
        data_tests:
          - relationships:
              arguments: {to: ref('dim_merchant_category'), field: mcc}
      - name: txn_type_cd
        data_tests:
          - accepted_values:
              arguments: {values: [PURCHASE, REFUND, CASH, PAYMENT]}
