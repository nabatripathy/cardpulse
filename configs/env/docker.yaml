# Docker profile (docker-compose.yml): SeaweedFS as S3, Iceberg REST catalog, Marquez
# for lineage. Landing files are on a shared volume mounted at /data/landing.
env: docker
landing_root: /data/landing
writer: pyiceberg
catalog:
  name: cardpulse
  type: rest
  properties:
    uri: http://iceberg-rest:8181
    warehouse: s3://cardpulse-local-lakehouse/
    s3.endpoint: http://seaweedfs:9000
    s3.access-key-id: cardpulse
    s3.secret-access-key: cardpulse-local-only
    s3.path-style-access: "true"
    s3.region: us-east-1
lineage:
  transport: http
  url: http://marquez:5000
  namespace: cardpulse-docker
gold:
  target: local
  warehouse_path: /data/gold/warehouse.duckdb
  lineage_namespace: duckdb://gold
