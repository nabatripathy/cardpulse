# CardPulse local platform (docker profile, configs/env/docker.yaml).
#
#   make up        # start SeaweedFS (S3), the Iceberg REST catalog and Marquez
#   make demo-docker
#
# CI (.github/workflows/docker.yml) starts this whole stack on every pull request, runs
# the small portfolio through Bronze and Silver, and verifies tables in the S3 store
# (SeaweedFS) and lineage in Marquez. CARDPULSE_PROFILE picks the synthetic portfolio (default: default).
name: cardpulse

x-s3-creds: &s3-creds
  AWS_ACCESS_KEY_ID: cardpulse
  AWS_SECRET_ACCESS_KEY: cardpulse-local-only
  AWS_REGION: us-east-1

services:
  # S3-compatible object store. (MinIO's images are no longer served by Docker Hub; see IMP-017.)
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=512
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000", "9333:9333"]
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    depends_on: [seaweedfs]
    environment:
      <<: *s3-creds
      CATALOG_WAREHOUSE: s3://cardpulse-local-lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8181:8181"]

  marquez-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez-local-only
      POSTGRES_DB: marquez
    volumes: [marquez-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      retries: 20

  marquez:
    image: marquezproject/marquez:0.51.1
    depends_on:
      marquez-db: {condition: service_healthy}
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez-local-only
    ports: ["5000:5000", "5001:5001"]

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    depends_on: [marquez]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    ports: ["3000:3000"]

  # One-shot runner (configs/env/docker.yaml): generate, Bronze, Silver, reports, then verify.
  cardpulse:
    build: {context: ., dockerfile: docker/Dockerfile}
    profiles: [run]
    depends_on: [seaweedfs, iceberg-rest, marquez]
    environment:
      <<: *s3-creds
    volumes:
      - landing:/data/landing
    command: >
      sh -c "python tools/wait_for.py http://seaweedfs:9333/cluster/status http://iceberg-rest:8181/v1/config
               http://marquez:5000/api/v1/namespaces &&
             python tools/ensure_bucket.py --env docker &&
             cardpulse-synth --config synthetic-data/config/${CARDPULSE_PROFILE:-default}.yaml --env docker --clean &&
             cardpulse-ingest run --env docker --all &&
             cardpulse-silver run --env docker --fail-on-reject &&
             cardpulse-ingest report --env docker &&
             cardpulse-silver report --env docker &&
             python tools/verify_docker_profile.py --env docker"

volumes:
  seaweedfs-data:
  marquez-db:
  landing:
