# CardPulse local platform (docker profile, configs/env/docker.yaml).
#
#   make up        # start MinIO, the Iceberg REST catalog and Marquez
#   make demo-docker
#
# Status: written for Increment 1 but not started in the build workspace (no Docker
# daemon there). CI validates this file with `docker compose config`.
name: cardpulse

x-minio-creds: &minio-creds
  AWS_ACCESS_KEY_ID: cardpulse
  AWS_SECRET_ACCESS_KEY: cardpulse-local-only
  AWS_REGION: us-east-1

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cardpulse
      MINIO_ROOT_PASSWORD: cardpulse-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 cardpulse cardpulse-local-only &&
                  mc mb --ignore-existing local/cardpulse-local-lakehouse"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    depends_on:
      minio-init: {condition: service_completed_successfully}
    environment:
      <<: *minio-creds
      CATALOG_WAREHOUSE: s3://cardpulse-local-lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8181:8181"]

  marquez-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez-local-only
      POSTGRES_DB: marquez
    volumes: [marquez-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      retries: 20

  marquez:
    image: marquezproject/marquez:0.51.1
    depends_on:
      marquez-db: {condition: service_healthy}
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez-local-only
    ports: ["5000:5000", "5001:5001"]

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    depends_on: [marquez]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    ports: ["3000:3000"]

  # One-shot runner: generates synthetic data and loads Bronze using configs/env/docker.yaml.
  cardpulse:
    build: {context: ., dockerfile: docker/Dockerfile}
    profiles: [run]
    depends_on: [iceberg-rest, marquez]
    environment:
      <<: *minio-creds
    volumes:
      - landing:/data/landing
    command: >
      sh -c "cardpulse-synth --config synthetic-data/config/default.yaml --env docker &&
             cardpulse-ingest run --env docker --all &&
             cardpulse-silver run --env docker &&
             cardpulse-ingest report --env docker &&
             cardpulse-silver report --env docker"

volumes:
  minio-data:
  marquez-db:
  landing:
